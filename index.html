<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge — Video Editor</title>
<meta name="description" content="ClipForge — a free video editor that runs in your browser. Trim, split, keyframes, masks, filters, effects, transitions, captions, green screen and more. Your files never leave your device.">
<meta property="og:title" content="ClipForge — Video Editor">
<meta property="og:description" content="A free video editor in your browser. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2320d5ec'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&family=Pacifico&family=Anton&family=Permanent+Marker&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1012; --panel:#17181b; --panel2:#1e2024; --line:#2a2c31; --text:#e9eaee; --mute:#8b8f98;
  --accent:#20d5ec; --accent2:#7c5cff; --danger:#ff5470; --clip-v:#2c5f8a; --clip-i:#3b6f4a; --clip-t:#7a4fb0; --clip-a:#246b5c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
.app{display:grid;grid-template-rows:48px minmax(0,1fr) 6px var(--tl-h,300px);height:100vh}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
.top .sp{flex:1}
.top select,.top input[type=color]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.top input[type=color]{width:34px;height:28px;padding:2px}
.top label{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0}
.btn:hover{border-color:#3a3d44}
.btn.primary{background:linear-gradient(135deg,var(--accent),#18b4f0);color:#002a33;border:none;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
/* middle */
.mid{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;min-height:0}
.left,.right{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.left{border-right:1px solid var(--line)} .right{border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{flex:1;min-width:52px;background:none;border:none;padding:7px 4px;border-radius:6px;color:var(--mute);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{opacity:.9}
.tab.on{background:var(--panel2);color:var(--text)}
.pane{flex:1;overflow:auto;padding:12px}
.drop{border:1.5px dashed #3a3d44;border-radius:10px;padding:16px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:12px}
.drop.over{border-color:var(--accent);color:var(--accent)}
.drop b{display:block;color:var(--text);margin-bottom:4px}
.drop .ic{display:block;margin:0 auto 6px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/10;cursor:grab;border:1px solid var(--line)}
.m img{width:100%;height:100%;object-fit:cover;display:block}
.m .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .du{position:absolute;right:5px;top:4px;font-size:10px;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:4px}
.m .add{position:absolute;right:5px;bottom:18px;width:24px;height:24px;border-radius:50%;border:none;background:var(--accent);color:#002a33;font-weight:800;cursor:pointer;opacity:0;transition:.15s}
.m:hover .add{opacity:1}
.m.aud{display:flex;align-items:center;justify-content:center;color:#7ff0d0;background:linear-gradient(135deg,#123c35,#0d2723)}
.m .add{display:flex;align-items:center;justify-content:center;padding:0}
.preset{border-radius:8px;padding:14px 8px;text-align:center;background:var(--panel2);border:1px solid var(--line);cursor:pointer;min-height:58px;display:flex;align-items:center;justify-content:center}
.preset:hover{border-color:var(--accent)}
.fx{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--panel2)}
.fx.on{border-color:var(--accent)}
.fx canvas{width:100%;display:block;aspect-ratio:16/10}
.fx div{padding:4px 6px;font-size:11px}
.hint{color:var(--mute);font-size:12px;line-height:1.6}
h4{margin:14px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
h4:first-child{margin-top:0}
/* preview */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}
.canvasWrap{position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.canvasWrap canvas{position:absolute;inset:0;width:100%;height:100%}
#overlay{cursor:default}
.transport{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
.tc{font-variant-numeric:tabular-nums;color:var(--mute);min-width:150px;text-align:center;font-size:12px}
.tc b{color:var(--text);font-weight:600}
.ib{width:34px;height:34px;border-radius:50%;border:none;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.ib.big{width:40px;height:40px;background:var(--text);color:#111}
/* inspector */
.insp-empty{padding:30px 16px;color:var(--mute);text-align:center;line-height:1.7}
.insp-empty .ic{display:block;margin:0 auto 10px;color:#4b5058}
h4 .ic{vertical-align:-1px}
.card h3{display:flex;align-items:center;gap:8px}.card h3 .ic{color:#3ddc6b}
.row{display:grid;grid-template-columns:86px 1fr 52px 22px;gap:8px;align-items:center;margin-bottom:9px}
.row label{color:var(--mute);font-size:12px}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.row input[type=number]{width:52px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 4px;font-size:11px}
.kfb{width:20px;height:20px;border:none;background:none;cursor:pointer;color:#555c66;font-size:13px;padding:0}
.kfb.has{color:#c9a227}.kfb.on{color:#ffcf33}.kfb.on .ic{fill:currentColor}
.kfb{display:flex;align-items:center;justify-content:center}
.row2{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.row2 label{color:var(--mute);font-size:12px;min-width:86px}
.row2 select,.row2 input[type=text],.row2 textarea{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.row2 textarea{min-height:56px;resize:vertical}
.row2 input[type=color]{width:38px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);padding:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:5px 10px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--mute);font-size:12px}
/* splitter + timeline */
.split{background:var(--panel);border-top:1px solid var(--line);cursor:ns-resize}
.tlwrap{display:flex;flex-direction:column;background:var(--panel);min-height:0}
.tools{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line)}
.tb{background:none;border:none;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:5px;font-size:12px}
.tb:hover{background:var(--panel2)} .tb:disabled{opacity:.35;cursor:default;background:none}
.tb.on{color:var(--accent)}
.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.tools .sp{flex:1}
.tools input[type=range]{width:110px;accent-color:var(--accent)}
.tl{flex:1;display:grid;grid-template-columns:96px 1fr;min-height:0}
.heads{border-right:1px solid var(--line);overflow:hidden}
.heads .rh{height:26px;border-bottom:1px solid var(--line)}
.th{display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #222429;font-size:11px;color:var(--mute)}
.th button{background:none;border:none;color:var(--mute);cursor:pointer;padding:2px;font-size:12px;display:flex;border-radius:4px}
.th button:hover{color:var(--text);background:var(--panel2)}
.th button.on{color:var(--danger)}
.scroll{overflow:auto;position:relative}
.inner{position:relative;min-height:100%}
.ruler{height:26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3;cursor:pointer}
.ruler canvas{position:absolute;left:0;top:0;height:26px}
.lane{position:relative;border-bottom:1px solid #222429}
.lane.drop-ok{background:rgba(32,213,236,.06)}
.lane.main{background:rgba(255,255,255,.015)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;cursor:grab;border:1.5px solid rgba(255,255,255,.12);background-repeat:repeat-x;background-size:auto 100%;font-size:11px;touch-action:none}
.clip.sel{border-color:#fff;box-shadow:0 0 0 1px #fff}
.clip .lbl{position:absolute;left:8px;top:3px;right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;font-weight:500;display:flex;align-items:center;gap:4px}
.clip .lbl .ic{filter:drop-shadow(0 1px 1px #000)}
.clip .sub{position:absolute;left:8px;bottom:3px;font-size:10px;color:rgba(255,255,255,.8);text-shadow:0 1px 2px #000;pointer-events:none}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.0)}
.clip.sel .h{background:rgba(255,255,255,.85)}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip .kd{position:absolute;bottom:6px;width:8px;height:8px;background:#ffcf33;transform:translateX(-4px) rotate(45deg);pointer-events:none;box-shadow:0 0 0 1px #000}
.clip .wave{position:absolute;left:0;right:0;bottom:0;height:60%;opacity:.55;pointer-events:none}
.clip .fadeL,.clip .fadeR{position:absolute;top:0;bottom:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent)}
.clip .fadeR{right:0;background:linear-gradient(270deg,rgba(0,0,0,.55),transparent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:4;pointer-events:none;margin-left:-1px}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #fff}
.snapline{position:absolute;top:26px;bottom:0;width:1px;background:var(--accent);z-index:4;pointer-events:none;display:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,92vw)}
.card h3{margin:0 0 6px;font-size:18px}
.card p{color:var(--mute);margin:6px 0 14px;line-height:1.6}
.card .row2 label{min-width:110px}
.pbar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:12px 0}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card video{width:100%;border-radius:8px;margin:8px 0;background:#000;max-height:240px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tmark{position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:6px;background:#2a2c31;border:1px solid #4a4e56;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;color:#c9ced4}
.tmark:hover{border-color:var(--accent)}
.tmark.on{background:var(--accent);color:#002a33;border-color:var(--accent)}
.right .tab{flex:0 0 auto;min-width:0;padding:6px 9px}
.tile{border-radius:8px;padding:10px 8px;text-align:center;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile:hover{border-color:var(--accent)} .tile.on{border-color:var(--accent);color:var(--accent)}
.tile .ic{color:var(--accent)}
.sfx{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px}
.sfx span{flex:1}
.sfx button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--text);cursor:pointer;display:flex;padding:4px}
.sfx button:hover{border-color:var(--accent)}
.wide{width:100%;justify-content:center;margin-bottom:8px}
.btn.rec{background:#ff5470;color:#fff;border-color:#ff5470}
.note{background:rgba(255,207,51,.08);border:1px solid rgba(255,207,51,.25);color:#e6d7a0;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;margin:8px 0}
.row2 .grow{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2e34;border:1px solid var(--line);padding:9px 14px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.narrow{display:none}
@media (max-width:1050px){ .mid{grid-template-columns:240px minmax(0,1fr) 270px} }
@media (max-width:820px){ .narrow{display:flex;position:fixed;inset:0;z-index:100;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.7;color:var(--mute)} .narrow b{color:var(--text);font-size:16px} }
</style>
</head>
<body>
<div class="narrow"><div><b>ClipForge needs a bigger screen</b><br>Open this page on a laptop or desktop (at least 820px wide), or turn a tablet sideways.</div></div>

<div class="app" id="app">
  <div class="top">
    <div class="logo"><i></i>ClipForge</div>
    <span class="hint" id="projInfo"></span>
    <div class="sp"></div>
    <label>Ratio <select id="aspect">
      <option value="16:9">16:9 · YouTube</option><option value="9:16">9:16 · Reels / Shorts</option>
      <option value="1:1">1:1 · Square</option><option value="4:5">4:5 · Portrait post</option><option value="4:3">4:3 · Classic</option>
    </select></label>
    <label>Quality <select id="quality"><option value="720">720p</option><option value="1080">1080p</option><option value="1440">2K</option><option value="2160">4K</option></select></label>
    <label>Background <input type="color" id="bgColor" value="#000000"></label>
    <button class="btn primary" id="exportBtn"><i data-ic="upload"></i> Export</button>
  </div>

  <div class="mid">
    <!-- LEFT: assets -->
    <div class="left">
      <div class="tabs" id="ltabs">
        <button class="tab on" data-t="media"><i data-ic="clapperboard" data-s="18"></i>Media</button>
        <button class="tab" data-t="audio"><i data-ic="music" data-s="18"></i>Audio</button>
        <button class="tab" data-t="text"><i data-ic="type" data-s="18"></i>Text</button>
        <button class="tab" data-t="stickers"><i data-ic="sticker" data-s="18"></i>Stickers</button>
        <button class="tab" data-t="effects"><i data-ic="sparkles" data-s="18"></i>Effects</button>
        <button class="tab" data-t="transitions"><i data-ic="arrow-left-right" data-s="18"></i>Transitions</button>
        <button class="tab" data-t="filters"><i data-ic="palette" data-s="18"></i>Filters</button>
        <button class="tab" data-t="smart"><i data-ic="wand-sparkles" data-s="18"></i>Smart</button>
      </div>
      <div class="pane" id="lpane"></div>
    </div>

    <!-- CENTER: preview -->
    <div class="center">
      <div class="stage" id="stage">
        <div class="canvasWrap" id="cwrap">
          <canvas id="view"></canvas>
          <canvas id="overlay"></canvas>
        </div>
      </div>
      <div class="transport">
        <button class="ib" id="toStart" title="Go to start (Home)"><i data-ic="skip-back"></i></button>
        <button class="ib" id="stepBack" title="Back one frame (←)"><i data-ic="chevron-left" data-s="18"></i></button>
        <button class="ib big" id="playBtn" title="Play / pause (Space)"><i data-ic="play" data-s="18"></i></button>
        <button class="ib" id="stepFwd" title="Forward one frame (→)"><i data-ic="chevron-right" data-s="18"></i></button>
        <button class="ib" id="toEnd" title="Go to end (End)"><i data-ic="skip-forward"></i></button>
        <div class="tc" id="tc"><b>00:00:00</b> / 00:00:00</div>
      </div>
    </div>

    <!-- RIGHT: inspector -->
    <div class="right">
      <div class="tabs" id="rtabs"></div>
      <div class="pane" id="rpane"></div>
    </div>
  </div>

  <div class="split" id="splitter" title="Drag to resize the timeline"></div>

  <!-- TIMELINE -->
  <div class="tlwrap">
    <div class="tools">
      <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)"><i data-ic="undo-2"></i>Undo</button>
      <button class="tb" id="redoBtn" title="Redo (Ctrl+Shift+Z)"><i data-ic="redo-2"></i>Redo</button>
      <span class="sep"></span>
      <button class="tb" id="splitBtn" title="Split at playhead (Ctrl+B)"><i data-ic="scissors"></i>Split</button>
      <button class="tb" id="delBtn" title="Delete (Del)"><i data-ic="trash-2"></i>Delete</button>
      <button class="tb" id="dupBtn" title="Duplicate (Ctrl+D)"><i data-ic="copy"></i>Duplicate</button>
      <button class="tb" id="kfBtn" title="Add keyframe to position, scale, rotation & opacity (K)"><i data-ic="diamond"></i>Keyframe</button>
      <button class="tb" id="freezeBtn" title="Freeze the current frame for 3 s"><i data-ic="snowflake"></i>Freeze</button>
      <span class="sep"></span>
      <button class="tb" id="addTrackBtn" title="Add an overlay track"><i data-ic="plus"></i>Track</button>
      <button class="tb on" id="snapBtn" title="Snapping"><i data-ic="magnet"></i>Snap</button>
      <div class="sp"></div>
      <span class="hint" style="display:flex"><i data-ic="zoom-out"></i></span><input type="range" id="zoom" min="10" max="300" value="60"><span class="hint" style="display:flex"><i data-ic="zoom-in"></i></span>
    </div>
    <div class="tl">
      <div class="heads" id="heads"></div>
      <div class="scroll" id="tscroll">
        <div class="inner" id="tinner">
          <div class="ruler" id="ruler"><canvas id="rulerC"></canvas></div>
          <div id="lanes"></div>
          <div class="playhead" id="playhead"></div>
          <div class="snapline" id="snapline"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileIn" multiple accept="video/*,image/*,audio/*" hidden>

<div class="modal" id="exportModal">
  <div class="card" id="exportCard"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = (() => { let n = 1; return p => p + (n++); })();
const FPS = 30;
const fmt = t => { t = Math.max(0,t); const m = Math.floor(t/60), s = Math.floor(t%60), f = Math.floor((t%1)*FPS); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`; };
const fmtS = t => t < 60 ? t.toFixed(1)+'s' : Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
// Lucide icons → inline SVG strings
const LUCIDE = window.lucide && window.lucide.icons;
const ICON_FALLBACK = { play:'▶', pause:'❚❚', 'skip-back':'|◀', 'skip-forward':'▶|', 'chevron-left':'‹', 'chevron-right':'›', plus:'+', x:'×' };
const attrStr = a => Object.entries(a).map(([k,v]) => `${k}="${String(v).replace(/"/g,'&quot;')}"`).join(' ');
function ic(name, size = 16, extra = ''){
  const key = name.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join('');

async function importFiles(files, opts = {}){

    const type = f.type.startsWith('video') ? 'video' : f.type.startsWith('image') ? 'image' : f.type.startsWith('audio') ? 'audio' : null;
    if (!type){ toast('Skipped ' + f.name + ' (not a video, image or audio file)'); continue; }
    const m = { id: uid('m'), type, name: f.name, url: URL.createObjectURL(f), duration: 5, w: 0, h: 0, file: f, hidden: !!opts.hidden };
    try {
      if (type === 'image'){
        const img = new Image(); img.src = m.url; await img.decode();
        m.el = img; m.w = img.naturalWidth; m.h = img.naturalHeight; m.thumb = makeThumb(img, m.w, m.h);
      } else {
        const el = document.createElement(type === 'video' ? 'video' : 'audio');
        el.preload = 'auto'; el.muted = true; el.playsInline = true; el.src = m.url;

      // serve the embedded model files to MediaPipe from memory

      const realFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === 'string' ? input : (input && input.url) || '';

    const list = project.clips.filter(c => c.track === tid && c.kind !== 'audio').sort((a,b) => a.start - b.start);

async function getDownloads(){

  return downloadsApi;
}
async function saveExport(){
  const name = ($('exName').value.trim() || 'clipforge-video').replace(/\.(webm|mp4)$/i,'') + '.' + exportExt;
  if (!downloadsApi){ // normal website (e.g. GitHub Pages): plain browser download
    const a = document.createElement('a'); a.href = URL.createObjectURL(exportBlob); a.download = name; document.body.appendChild(a); a.click(); a.remove();

  catch(e){ const code = e && e.code; $('exMsg').textContent = code === 'declined' ? 'Save cancelled.' : code === 'rate_limited' ? 'Another save prompt is open — try again in a moment.' : 'Could not save the file (' + (code || 'error') + ').'; }
}
let exportPrevQ = 720, exportFps = 30;
function startExport(q, fps){
  if (!window.MediaRecorder || !view.captureStream){ toast('This browser cannot export video. Try Chrome or Edge.'); return; }
  ensureAudio(); pause();
  exportPrevQ = project.quality; project.quality = q; applyCanvasSize(); exportFps = fps;
  const stream = view.captureStream(fps);
  if (recDest) recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';

  recChunks = [];

  catch(e){ recorder = new MediaRecorder(stream); exportExt = 'webm'; }
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    project.quality = exportPrevQ; applyCanvasSize();
    if (!exporting){ $('exportModal').classList.remove('on'); return; }   // cancelled
    exporting = false;
    exportBlob = new Blob(recChunks, { type: exportExt === 'mp4' ? 'video/mp4' : 'video/webm' });
    exportUI('done');
  };
  exporting = true; selIdBeforeExport = selId;

}

async function reverseClip(c){
  if (c.revOf){ pushHistory(); const o = c.revOf; c.mediaId = o.mediaId; c.in = o.in; c.revOf = null; syncEls(); renderAll(); toast('The clip plays forwards again'); return; }
  const m = mediaById(c.mediaId);
  if (!m || m.type !== 'video' || m.frames || c.freezeAt != null){ toast('Select a normal video clip to reverse'); return; }
  const s0 = c.in, len = srcLenOf(c);
  if (len > 30){ toast('Reverse works on up to 30 seconds of footage. Split the clip first.'); return; }
  ensureAudio(); pause();
  showBusy('Reversing clip…', 'Reading frames');
  const fps = 30, n = Math.max(1, Math.round(len * fps));
  const v = await tempVideo(m);
  const sc = Math.min(1, 1280 / m.w), cw = Math.round(m.w*sc), ch = Math.round(m.h*sc);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; const g = cv.getContext('2d');
  const frames = new Array(n);
  for (let i=0;i<n;i++){
    if (busyCancelled){ hideBusy(); return; }
    await seekTo(v, Math.min(m.duration - 0.03, s0 + i/fps));
    g.drawImage(v, 0, 0, cw, ch);
    frames[n-1-i] = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86));
    if (i % 3 === 0) setBusy(i/n * 0.9, `Frame ${i+1} of ${n}`);
  }
  setBusy(0.92, 'Reversing sound');
  let url = null, peaks = null;
  try {
    const dec = await decodeAudio(m);
    if (dec){ const ab = dec.buf, sr = ab.sampleRate, a = Math.floor(s0*sr), b = Math.min(ab.length, Math.floor((s0+len)*sr)); const chs = []; for (let k=0;k<ab.numberOfChannels;k++) chs.push(ab.getChannelData(k).slice(a, b).reverse()); url = URL.createObjectURL(encodeWav(chs, sr)); peaks = peaksFrom(chs[0]); }
  } catch(e){}
  const rm = { id: uid('m'), type:'video', name: m.name + ' (reversed)', url, duration: n/fps, w: m.w, h: m.h, frames, fps, thumb: m.thumb, thumbs: m.thumbs ? [...m.thumbs].reverse() : null, peaks, hidden: true, hasAudio: !!url };
  media.push(rm);
  pushHistory();
  c.revOf = { mediaId: m.id, in: c.in }; c.mediaId = rm.id; c.in = 0;
  if (hasCurve(c)){ c.curve = 'none'; c.dur = len / c.speed; rippleMain(c); }
  hideBusy(); syncEls(); renderAll(); toast('Clip reversed');
}

let voRec = null, voBlocked = false;
async function toggleVoiceover(){
  if (voRec){ voRec.stop(); return; }
  ensureAudio();
  let stream;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('none');
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch(e){ voBlocked = true; renderLeft(); toast('The microphone is not available here'); return; }
  const chunks = [], start = time;
  const mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); voRec = null; pause(); renderLeft();
    const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
    const n = media.filter(m => m.voice).length + 1, before = media.length;
    await importFiles([new File([blob], `Voiceover ${n}.${(mr.mimeType||'').includes('mp4') ? 'm4a' : 'webm'}`, { type: blob.type })]);
    if (media.length > before){ const m = media[media.length-1]; m.voice = true; addMediaClip(m, { track: freeAudioTrack(start, m.duration).id, start }); }
  };
  voRec = mr; mr.start(); play(); renderLeft();
}

function parseSubs(text){

function scriptToCaptions(text){

  btn('pipette', 'Green screen', () => { const s2 = sel(); if (!s2 || (s2.kind !== 'video' && s2.kind !== 'image')){ toast('Select a video or photo clip'); return; } pushHistory(); s2.key.on = true; rtab = 'cutout'; renderAll(); });
  sec('Tracking', 'Make text, a sticker or an overlay follow a moving object.');
  btn('crosshair', 'Track motion', () => { const s2 = sel(); if (!s2 || s2.kind === 'audio'){ toast('Select the text, sticker or overlay that should follow'); return; } rtab = 'track'; renderAll(); });
  sec('Captions', null);
  btn('captions', 'Captions from script or .srt', () => { ltab = 'text'; [...$('ltabs').children].forEach(x => x.classList.toggle('on', x.dataset.t === 'text')); renderLeft(); setTimeout(() => $('lpane').scrollTop = $('lpane').scrollHeight, 50); });
  p.insertAdjacentHTML('beforeend', '<div class="note" style="margin-top:14px"><b>Not available here:</b> speech-to-text captions and text-to-speech voices. Both need an online AI service or a large downloaded model, and Claude’s artifact viewer blocks those. They would work in a self-hosted version of ClipForge with a small server.</div>');
}

// ======================= AUTO CUT =======================
async function detectScenes(c){
  const m = c && mediaById(c.mediaId);
  if (!c || c.kind !== 'video' || !m || m.frames){ toast('Select a video clip first'); return; }
  if (hasCurve(c) || c.freezeAt != null){ toast('Remove the speed curve first'); return; }
  pause(); showBusy('Finding scene changes…');
  const v = await tempVideo(m), cv = document.createElement('canvas'); cv.width = 64; cv.height = 36;
  const g = cv.getContext('2d', { willReadFrequently: true });
  const len = srcLenOf(c), step = 1/8, n = Math.floor(len/step);
  let prev = null; const diffs = [];
  for (let i=0;i<=n;i++){
    if (busyCancelled){ hideBusy(); return; }
    const st = c.in + i*step; await seekTo(v, Math.min(st, m.duration - 0.05));
    g.drawImage(v, 0, 0, 64, 36); const d = g.getImageData(0,0,64,36).data, cur = new Float32Array(64*36);
    for (let j=0,q=0;j<cur.length;j++,q+=4) cur[j] = d[q]*0.3 + d[q+1]*0.59 + d[q+2]*0.11;
    if (prev){ let sm = 0; for (let j=0;j<cur.length;j++) sm += Math.abs(cur[j] - prev[j]); diffs.push({ st, v: sm/cur.length }); }
    prev = cur; setBusy(i/n);
  }
  hideBusy();
  if (diffs.length < 3){ toast('This clip is too short to analyse'); return; }
  const vals = diffs.map(d => d.v), mean = vals.reduce((a,b) => a+b, 0)/vals.length, sd = Math.sqrt(vals.reduce((a,b) => a + (b-mean)**2, 0)/vals.length);
  const thr = Math.max(20, mean + 2.5*sd), cuts = []; let last = -9;
  diffs.forEach((d, i) => { const peak = d.v > thr && (!diffs[i-1] || d.v >= diffs[i-1].v) && (!diffs[i+1] || d.v >= diffs[i+1].v); if (peak && d.st - last > 0.6){ cuts.push(d.st); last = d.st; } });
  if (!cuts.length){ toast('No scene changes found in this clip'); return; }
  pushHistory();
  cuts.map(st => c.start + (st - step/2 - c.in)/c.speed).sort((a,b) => b-a).forEach(t => splitAt(c, t));
  syncEls(); renderAll(); toast(`Split into ${cuts.length + 1} scenes`);
}

async function removeSilences(c){
  const m = c && mediaById(c.mediaId);
  if (!c || !(c.kind === 'video' || c.kind === 'audio') || !m || m.frames || !m.hasAudio){ toast('Select a video or audio clip that has sound'); return; }
  if (hasCurve(c) || c.freezeAt != null){ toast('Remove the speed curve first'); return; }
  pause(); showBusy('Finding silent parts…'); await nextFrame();
  let dec = null; try { ensureAudio(); dec = await decodeAudio(m); } catch(e){}
  if (!dec){ hideBusy(); toast('Could not read the sound of this clip'); return; }
  const ab = dec.buf, sr = ab.sampleRate, data = ab.getChannelData(0), hop = 0.02, win = Math.floor(sr*hop);
  const a0 = Math.floor(c.in*sr), a1 = Math.min(data.length, Math.floor((c.in + srcLenOf(c))*sr));
  const rms = []; for (let i=a0;i<a1;i+=win){ let sm = 0; const e = Math.min(a1, i+win); for (let j=i;j<e;j+=2) sm += data[j]*data[j]; rms.push(Math.sqrt(sm / Math.max(1, (e-i)/2))); }
  const sorted = [...rms].sort((a,b) => a-b), p90 = sorted[Math.floor(sorted.length*0.9)] || 0, thr = Math.max(0.008, p90*0.12);
  const minRun = Math.round(0.5/hop), pad = 0.12, keep = []; let segStart = 0, i = 0;
  while (i < rms.length){
    if (rms[i] < thr){ let j = i; while (j < rms.length && rms[j] < thr) j++;
      if (j - i >= minRun){ const sA = i*hop + pad, sB = j*hop - pad; if (sA > segStart + 0.05) keep.push([segStart, sA]); segStart = Math.max(segStart, sB); }
      i = j; } else i++;
  }
  const totalSrc = rms.length*hop; if (totalSrc - segStart > 0.05) keep.push([segStart, totalSrc]);
  hideBusy();
  const removed = srcLenOf(c) - keep.reduce((n, k) => n + k[1] - k[0], 0);
  if (!keep.length || removed < 0.3){ toast('No long silences found'); return; }
  pushHistory();
  const oldEnd = c.start + c.dur, pieces = []; let t = c.start;
  keep.forEach(([a, b], k) => {
    const q = JSON.parse(JSON.stringify(c)); q.id = uid('c'); q.in = c.in + a; q.dur = (b - a)/c.speed; q.start = t; q.kf = {};
    if (k > 0){ q.anim = { ...q.anim, in:'none' }; q.fadeIn = 0; q.trans = { type:'none', dur: q.trans.dur }; }
    if (k < keep.length - 1){ q.anim = { ...q.anim, out:'none' }; q.fadeOut = 0; }
    t += q.dur; pieces.push(q);
  });
  const shift = oldEnd - t;
  project.clips = project.clips.filter(x => x !== c);
  project.clips.filter(x => x.track === c.track && x.start >= oldEnd - 0.001).forEach(x => x.start -= shift);
  project.clips.push(...pieces); selId = pieces[0].id;
  syncEls(); renderAll(); toast(`Removed ${removed.toFixed(1)}s of silence (${keep.length} part${keep.length === 1 ? '' : 's'} kept)`);
}

async function autoEditToBeat(){
  const s0 = sel(), a = s0 && s0.kind === 'audio' ? s0 : project.clips.filter(c => c.kind === 'audio').sort((x,y) => x.start - y.start)[0];
  if (!a){ toast('Add a music track to the Audio track first'); return; }
  const pool = media.filter(m => !m.hidden && (m.type === 'video' || m.type === 'image'));
  if (!pool.length){ toast('Import some videos or photos first'); return; }
  const m = mediaById(a.mediaId);
  pause(); showBusy('Finding the beat…'); await nextFrame();
  let dec = null; try { ensureAudio(); dec = await decodeAudio(m); } catch(e){}
  if (!dec){ hideBusy(); toast('Could not read the music'); return; }
  const ab = dec.buf, sr = ab.sampleRate, d = ab.getChannelData(0), hop = 512, N = 1024;
  const i0 = Math.floor(a.in*sr), i1 = Math.min(d.length, Math.floor((a.in + srcLenOf(a))*sr));
  const en = []; for (let i=i0;i+N<i1;i+=hop){ let e = 0; for (let j=i;j<i+N;j+=2) e += d[j]*d[j]; en.push(e); }
  const flux = en.map((e, i) => { let s = 0, n = 0; for (let k=Math.max(0,i-10);k<i;k++){ s += en[k]; n++; } return Math.max(0, e - (n ? s/n : e)); });
  const mean = flux.reduce((x,y) => x+y, 0)/Math.max(1, flux.length), sd = Math.sqrt(flux.reduce((x,y) => x + (y-mean)**2, 0)/Math.max(1, flux.length));
  const thr = mean + 0.8*sd, hopT = hop/sr, beats = []; let last = -1;
  flux.forEach((f, i) => { const t = i*hopT; if (f > thr && f >= (flux[i-1]||0) && f >= (flux[i+1]||0) && t - last >= 0.32){ beats.push(t); last = t; } });
  hideBusy();
  const T0 = a.start, T1 = a.start + a.dur, cuts = [T0];
  for (const b of beats){ const t = a.start + b/a.speed; if (t - cuts[cuts.length-1] >= 0.6 && t < T1 - 0.3) cuts.push(t); }
  cuts.push(T1);
  const pts = [cuts[0]];
  for (let i=1;i<cuts.length;i++){ while (cuts[i] - pts[pts.length-1] > 2.5) pts.push(pts[pts.length-1] + 2); pts.push(cuts[i]); }
  pushHistory();
  const mt = mainTrack();
  project.clips = project.clips.filter(c => c.track !== mt.id);
  let made = 0;
  for (let i=0;i<pts.length-1;i++){
    const md = pool[i % pool.length], len = pts[i+1] - pts[i]; if (len < 0.1) continue;
    const kind = md.type === 'video' ? 'video' : 'image';
    let inn = 0, dur = len;
    if (kind === 'video'){ if (md.duration > len + 0.1) inn = Math.random()*(md.duration - len); else dur = md.duration; }
    const c = newClip(kind, { mediaId: md.id, track: mt.id, start: pts[i], dur, in: inn });
    if (i % 4 === 3) c.fx = [{ id:'pulse', amt:40 }];
    project.clips.push(c); made++;
  }
  selId = null; syncEls(); renderAll(); toast(`Made ${made} cuts on the beat (${beats.length} beats found)`);
}

// ======================= ENHANCE =======================
function autoEnhance(c){
  if (!c || (c.kind !== 'video' && c.kind !== 'image')){ toast('Select a video or photo clip'); return; }
  if (time < c.start || time >= c.start + c.dur){ toast('Move the playhead over the clip first'); return; }
  const src = sourceOf(c, time - c.start); if (!src){ toast('The clip isn’t ready yet — try again'); return; }
  const cv = document.createElement('canvas'); cv.width = 160; cv.height = 90;
  const g = cv.getContext('2d', { willReadFrequently: true }); g.drawImage(src.el, 0, 0, 160, 90);
  const d = g.getImageData(0,0,160,90).data, lum = []; let satSum = 0;
  for (let q=0;q<d.length;q+=4){ const r = d[q], gg = d[q+1], b = d[q+2]; lum.push(0.299*r + 0.587*gg + 0.114*b); const mx = Math.max(r,gg,b), mn = Math.min(r,gg,b); satSum += mx ? (mx-mn)/mx : 0; }
  lum.sort((a,b) => a-b);
  const lo = lum[Math.floor(lum.length*0.02)], hi = lum[Math.floor(lum.length*0.98)], mean = lum.reduce((a,b) => a+b, 0)/lum.length, sat = satSum/(d.length/4);
  pushHistory();
  c.adj.contrast = Math.round(clamp((225/Math.max(30, hi - lo) - 1)*60, -10, 45));
  c.adj.bright = Math.round(clamp((125 - mean)/125*55, -25, 40));
  c.adj.sat = Math.round(clamp((0.38 - sat)*90, -10, 35));
  c.adj.sharpen = 30;
  rtab = 'adjust'; renderAll();
  const sg = v => (v > 0 ? '+' : '') + v;
  toast(`Enhanced: brightness ${sg(c.adj.bright)}, contrast ${sg(c.adj.contrast)}, saturation ${sg(c.adj.sat)}, sharpen +30`);
}

// ======================= GREEN SCREEN COLOUR PICKER =======================
function canvasToSource(t, P, at){
  const m = mediaById(t.mediaId), tr = transformOf(t, at - t.start), box = contentBox(t), sr = srcRect(t, m);
  const dx = P.x - tr.x, dy = P.y - tr.y, cs = Math.cos(-tr.r), sn = Math.sin(-tr.r);
  let lx = (dx*cs - dy*sn)/tr.s, ly = (dx*sn + dy*cs)/tr.s; if (t.flipX) lx = -lx; if (t.flipY) ly = -ly;
  return { u: sr.sx + (lx/box.w + 0.5)*sr.sw, v: sr.sy + (ly/box.h + 0.5)*sr.sh };
}
function sourceToCanvas(t, q, at){
  const m = mediaById(t.mediaId), tr = transformOf(t, at - t.start), box = contentBox(t), sr = srcRect(t, m);
  let lx = ((q.u - sr.sx)/sr.sw - 0.5)*box.w, ly = ((q.v - sr.sy)/sr.sh - 0.5)*box.h; if (t.flipX) lx = -lx; if (t.flipY) ly = -ly;
  lx *= tr.s; ly *= tr.s; const cs = Math.cos(tr.r), sn = Math.sin(tr.r);
  return { x: tr.x + lx*cs - ly*sn, y: tr.y + lx*sn + ly*cs };
}
function pickKeyColor(c, P){
  const src = sourceOf(c, time - c.start); if (!src){ toast('Move the playhead over the clip'); return; }
  const q = canvasToSource(c, P, time);
  if (q.u < 0 || q.v < 0 || q.u >= src.w || q.v >= src.h){ toast('Click inside the clip'); return; }
  const cv = document.createElement('canvas'); cv.width = cv.height = 1; const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(src.el, Math.floor(q.u), Math.floor(q.v), 1, 1, 0, 0, 1, 1);
  const [r, gg, b] = g.getImageData(0,0,1,1).data;
  pushHistory(); c.key.on = true; c.key.color = '#' + [r, gg, b].map(x => x.toString(16).padStart(2,'0')).join('');
  renderInspector(); toast('Key colour set');
}

// ======================= MOTION TRACKING =======================
async function trackMotion(c, tgt){
  const m = tgt && mediaById(tgt.mediaId);
  if (!m || m.frames){ toast('Choose a video to follow'); return; }
  const t0 = Math.max(time, c.start, tgt.start), t1 = Math.min(c.start + c.dur, tgt.start + tgt.dur, t0 + 30);
  if (t1 - t0 < 0.2){ toast('Put the playhead where both clips overlap'); return; }
  const rel0 = t0 - c.start, P0 = { x: W/2 + propAt(c,'x',rel0), y: H/2 + propAt(c,'y',rel0) };
  const q0 = canvasToSource(tgt, P0, t0);
  if (q0.u < 0 || q0.v < 0 || q0.u > m.w || q0.v > m.h){ toast('Drag this clip over the object in the video first'); return; }
  pause(); showBusy('Tracking motion…', 'Following the object frame by frame');
  const v = await tempVideo(m), A = 320, k = A / m.w, AH = Math.max(8, Math.round(m.h * k));
  const cv = document.createElement('canvas'); cv.width = A; cv.height = AH; const g = cv.getContext('2d', { willReadFrequently: true });
  const gray = () => { const d = g.getImageData(0,0,A,AH).data, o = new Float32Array(A*AH); for (let i=0,q=0;i<o.length;i++,q+=4) o[i] = d[q]*0.3 + d[q+1]*0.59 + d[q+2]*0.11; return o; };
  const half = Math.max(4, Math.round((c.trackBox || 10)/100 * Math.min(A, AH)/2)), R = Math.max(8, Math.round(half*1.2));
  let px = Math.round(q0.u*k), py = Math.round(q0.v*k);
  const fps = 15, n = Math.max(1, Math.ceil((t1 - t0)*fps));
  await seekTo(v, sourceTime(tgt, t0 - tgt.start)); g.drawImage(v, 0, 0, A, AH);
  let img = gray();
  const size = (2*half+1)**2, tpl = new Float32Array(size), cur = new Float32Array(size);
  const grab = (im, cx, cy, out) => { let i = 0; for (let y=-half;y<=half;y++) for (let x=-half;x<=half;x++){ out[i++] = im[clamp(cy+y,0,AH-1)*A + clamp(cx+x,0,A-1)]; } };
  grab(img, px, py, tpl);
  const pts = [{ t: t0, u: q0.u, v: q0.v }];
  for (let i=1;i<=n;i++){
    if (busyCancelled){ hideBusy(); return; }
    const t = Math.min(t1, t0 + i/fps);
    await seekTo(v, sourceTime(tgt, t - tgt.start)); g.drawImage(v, 0, 0, A, AH); img = gray();
    let best = Infinity, bx = px, by = py;
    for (let dy=-R; dy<=R; dy++) for (let dx=-R; dx<=R; dx++){
      const cx = px + dx, cy = py + dy; if (cx < half || cy < half || cx >= A-half || cy >= AH-half) continue;
      let sad = 0, j = 0;
      for (let y=-half; y<=half && sad < best; y++){ const row = (cy+y)*A + cx; for (let x=-half;x<=half;x++) sad += Math.abs(img[row+x] - tpl[j++]); }
      if (sad < best){ best = sad; bx = cx; by = cy; }
    }
    px = bx; py = by;
    grab(img, px, py, cur); for (let j=0;j<size;j++) tpl[j] = tpl[j]*0.8 + cur[j]*0.2;
    pts.push({ t, u: px/k, v: py/k });
    if (i % 3 === 0){ setBusy(i/n, `${Math.round(i/n*100)}%`); await nextFrame(); }
  }
  hideBusy();
  pushHistory();
  const base = sourceToCanvas(tgt, q0, t0), x0 = propAt(c,'x',rel0), y0 = propAt(c,'y',rel0), relEnd = t1 - c.start;
  for (const pr of ['x','y']) c.kf[pr] = (c.kf[pr] || []).filter(kk => kk.t < rel0 - 1e-3 || kk.t > relEnd + 1e-3);
  pts.forEach((pt, i) => {
    if (i % 2 && i !== pts.length - 1) return;
    const P = sourceToCanvas(tgt, pt, pt.t), r = pt.t - c.start;
    c.kf.x.push({ t: r, v: Math.round(x0 + P.x - base.x), ease:'linear' });
    c.kf.y.push({ t: r, v: Math.round(y0 + P.y - base.y), ease:'linear' });
  });
  c.kf.x.sort((a,b) => a.t - b.t); c.kf.y.sort((a,b) => a.t - b.t);
  renderAll(); toast(`Tracked ${fmtS(t1 - t0)} — the clip now follows the object`);
}

// ======================= TOP BAR =======================
$('aspect').onchange = e => { pushHistory(); project.aspect = e.target.value; applyCanvasSize(); renderInspector(); };
$('quality').onchange = e => { pushHistory(); project.quality = +e.target.value; applyCanvasSize(); renderInspector(); };
$('bgColor').addEventListener('focus', beginEdit);
$('bgColor').oninput = e => { project.bg = e.target.value; };

// transport
$('playBtn').onclick = () => playing ? pause() : play();
$('toStart').onclick = () => { seek(0); updateInspectorValues(); };
$('toEnd').onclick = () => { pause(); seek(projectDuration()); updateInspectorValues(); };
$('stepBack').onclick = () => { pause(); seek(Math.round(time*FPS - 1)/FPS); updateInspectorValues(); };
$('stepFwd').onclick = () => { pause(); seek(Math.round(time*FPS + 1)/FPS); updateInspectorValues(); };

// keyboard shortcuts
addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || (tag === 'input' && !['range','checkbox','color'].includes(e.target.type)) || tag === 'select') return;
  if (exporting) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  else if (mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === 'b'){ e.preventDefault(); doSplit(); }
  else if (mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); doDuplicate(); }
  else if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); doDelete(); }
  else if (e.key === 'k' || e.key === 'K'){ $('kfBtn').click(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); $('stepBack').click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); $('stepFwd').click(); }
  else if (e.key === 'Home'){ $('toStart').click(); }
  else if (e.key === 'End'){ $('toEnd').click(); }
  else if (e.key === 'Escape'){ selId = null; renderTimeline(); renderInspector(); }
});

function renderAll(){ renderTimeline(); renderInspector(); if (['filters','effects','transitions','smart'].includes(ltab)) renderLeft(); updateTimecode(); }

// ======================= START =======================
applyCanvasSize();
renderLeft(); renderAll();
requestAnimationFrame(frame);
window.__cf = { project, media, importFiles, addMediaClip, addText, seek, play, pause, doSplit, startExport, get time(){ return time; }, set sel(v){ selId = v; renderAll(); }, toggleKf, setProp, renderAll, splitAt, reverseClip, detectScenes, removeSilences, autoEditToBeat, autoEnhance, trackMotion, addSfx, parseSubs, makeCaptions, scriptToCaptions, loadSegmenter, setCurve, prevAdj, get segState(){ return segState; }, set rtab(v){ rtab = v; renderAll(); }, get busy(){ return $('exportModal').classList.contains('on'); } };
})();
